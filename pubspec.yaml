name: order
description: "Order — Multi-vendor ordering app for customers"
publish_to: 'none'
version: 1.0.3+5

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.3.0
  get_storage: ^2.1.1
  intl: ^0.20.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  image_picker: ^1.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  smooth_page_indicator: ^1.2.0+3
  flutter_rating_bar: ^4.0.1
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.2
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/launcher1.jpg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/launcher1.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/launcher1.jpg
    - assets/launcher_icon.jpg
